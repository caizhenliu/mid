<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>投稿審查系統</title>
  <style>
    :root {
      --ink: #203b4a;
      --muted: #647783;
      --line: #d7e1df;
      --canvas: #edf3f1;
      --paper: #ffffff;
      --teal: #087e78;
      --teal-dark: #06645f;
      --amber: #9a5c08;
      --green: #27734d;
      --red: #b43e48;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 32px clamp(16px, 4vw, 64px) 56px; background: var(--canvas); color: var(--ink); font-family: "Segoe UI", "Noto Sans TC", sans-serif; }
    h1 { margin: 0 0 26px; font-size: 30px; }
    h2 { margin: 30px 0 16px; font-size: 22px; }
    h3 { margin: 0 0 18px; font-size: 20px; }
    .nav-tabs { display: flex; gap: 8px; margin: 0 calc(-1 * clamp(16px, 4vw, 64px)) 28px; padding: 0 clamp(16px, 4vw, 64px); border-bottom: 1px solid var(--line); background: var(--paper); }
    .tab-btn { padding: 16px 20px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font: inherit; font-weight: 700; }
    .tab-btn.active { border-bottom-color: var(--teal); color: var(--teal-dark); }
    .card { width: 100%; margin-bottom: 16px; padding: 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); box-shadow: 0 4px 14px rgba(32,59,74,.06); }
    #authorSection > .card { padding: 28px; }
    input, textarea, select { width: 100%; margin: 8px 0 18px; padding: 12px 14px; border: 1px solid #c8d5d2; border-radius: 6px; background: #fbfdfc; color: var(--ink); font: inherit; }
    input:focus, textarea:focus, select:focus { outline: 2px solid rgba(8,126,120,.2); border-color: var(--teal); }
    button { padding: 10px 16px; border: 0; border-radius: 5px; cursor: pointer; font: inherit; font-weight: 700; transition: background .16s ease, transform .16s ease, border-color .16s ease; }
    button:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--teal); color: white; }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-success { background: var(--green); color: white; }
    .btn-warning { background: #f4c66a; color: #3e300f; }
    .btn-danger { background: var(--red); color: white; }
    .btn-secondary { border: 1px solid var(--line); background: #f4f7f6; color: var(--ink); }
    .badge { display: inline-block; padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .badge-draft { background: #e8edf0; color: #526570; }
    .badge-review { background: #fff0cf; color: var(--amber); }
    .badge-pass { background: #dff1e6; color: var(--green); }
    .category-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: 100%; margin-bottom: 24px; }
    .category-btn { display: flex; min-height: 150px; flex-direction: column; justify-content: space-between; width: 100%; padding: 22px; border: 1px solid var(--line); border-top: 5px solid var(--teal); border-radius: 8px; background: var(--paper); color: var(--ink); text-align: left; box-shadow: 0 4px 14px rgba(32,59,74,.06); }
    .category-btn[data-status="編輯中"] { border-top-color: #758794; }
    .category-btn[data-status="已審查"] { border-top-color: #d09427; }
    .category-btn[data-status="已通過"] { border-top-color: var(--green); }
    .category-btn:hover { border-right-color: var(--teal); border-bottom-color: var(--teal); border-left-color: var(--teal); }
    .category-name { font-size: 20px; }
    .category-count { color: var(--muted); font-size: 14px; font-weight: 500; }
    .category-header { display: flex; align-items: center; gap: 14px; margin: 8px 0 20px; }
    .category-header h3 { margin: 0; }
    .article-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .article-heading h4 { margin: 0; font-size: 19px; }
    @media (max-width: 760px) {
      body { padding: 22px 16px 36px; }
      .nav-tabs { margin-right: -16px; margin-left: -16px; padding-right: 16px; padding-left: 16px; }
      .tab-btn { padding: 14px 10px; font-size: 14px; }
      .category-list { grid-template-columns: 1fr; gap: 10px; }
      .category-btn { min-height: 112px; }
      .card, #authorSection > .card { padding: 18px; }
    }
  </style>
</head>
<body>

  <h1>投稿審查系統</h1>

  <div class="nav-tabs">
    <button class="tab-btn active" id="btnTabAuthor" onclick="switchRole('author')">✍️ 作者專區</button>
    <button class="tab-btn" id="btnTabEditor" onclick="switchRole('editor')">🔍 編輯審查專區</button>
  </div>

  <!-- ==================== 作者視角 ==================== -->
  <div id="authorSection">
    <div class="card">
      <h3>撰寫新投稿 / 編輯草稿</h3>
      <input type="hidden" id="editArtId">
      <label>作者名稱：</label>
      <input type="text" id="authorName" value="劉采蓁">
      <label>稿件類別：</label>
      <input type="text" id="category" placeholder="例如：資訊管理 / 軟體工程">
      <label>稿件標題：</label>
      <input type="text" id="artTitle" placeholder="請輸入標題">
      <label>文章內容：</label>
      <textarea id="artContent" rows="5" placeholder="請輸入文章詳細內容"></textarea>
      
      <button class="btn-primary" id="btnSave" onclick="saveArticle()">儲存草稿 (新增/編輯)</button>
      <button class="btn-secondary" onclick="resetForm()">重設表單</button>
    </div>

    <h2>我的投稿稿件清單</h2>
    <div id="authorArticleList">載入中...</div>
  </div>

  <!-- ==================== 編輯視角 ==================== -->
  <div id="editorSection" style="display: none;">
    <h2>待審查稿件清單</h2>
    <div id="editorPendingList">載入中...</div>
  </div>

  <script>
    function switchRole(role) {
      if (role === 'author') {
        document.getElementById('authorSection').style.display = 'block';
        document.getElementById('editorSection').style.display = 'none';
        document.getElementById('btnTabAuthor').classList.add('active');
        document.getElementById('btnTabEditor').classList.remove('active');
        loadAuthorArticles();
      } else {
        document.getElementById('authorSection').style.display = 'none';
        document.getElementById('editorSection').style.display = 'block';
        document.getElementById('btnTabAuthor').classList.remove('active');
        document.getElementById('btnTabEditor').classList.add('active');
        loadPendingArticles();
      }
    }

    // ---------- 作者功能 ----------
    async function loadAuthorArticles() {
      const author = document.getElementById('authorName').value.trim();
      if (!author) return;

      const res = await fetch(`/api/articles/author/${author}`);
      const list = await res.json();
      const container = document.getElementById('authorArticleList');
      renderCategoryList(container, list, 'author');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function getStatusCategory(article, role) {
      if (article.status === '審查中') return role === 'editor' ? '待審查' : '已審查';
      return article.status || '其他';
    }

    function renderCategoryList(container, articles, role) {
      container.innerHTML = '';
      if (articles.length === 0) {
        container.innerHTML = role === 'author' ? '<p>目前尚無投稿紀錄。</p>' : '<p>目前沒有待審查或已通過稿件。</p>';
        return;
      }

      const categoryNames = role === 'author' ? ['編輯中', '已審查', '已通過'] : ['待審查', '已通過'];
      const buttons = document.createElement('div');
      buttons.className = 'category-list';

      categoryNames.forEach(category => {
        const count = articles.filter(item => getStatusCategory(item, role) === category).length;
        const button = document.createElement('button');
        button.className = 'category-btn';
        button.dataset.status = category;
        button.innerHTML = `<span class="category-name">${escapeHtml(category)}</span><span class="category-count">${count} 篇稿件</span>`;
        button.addEventListener('click', () => renderCategoryDocuments(container, articles, category, role));
        buttons.appendChild(button);
      });
      container.appendChild(buttons);
    }

    function renderCategoryDocuments(container, articles, category, role) {
      const documents = articles.filter(item => getStatusCategory(item, role) === category);
      container.innerHTML = `
        <div class="category-header">
          <button class="btn-secondary" type="button">返回分類</button>
          <h3>${escapeHtml(category)}</h3>
        </div>
      `;
      container.querySelector('.category-header button').addEventListener('click', () => renderCategoryList(container, articles, role));

      documents.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        if (role === 'author') {
          const badgeClass = item.status === '編輯中' ? 'badge-draft' : (item.status === '審查中' ? 'badge-review' : 'badge-pass');
          card.innerHTML = `
            <div class="article-heading">
              <h4>${escapeHtml(item.title)}</h4>
              <span class="badge ${badgeClass}">${escapeHtml(getStatusCategory(item))}</span>
            </div>
            <p style="white-space: pre-wrap;">${escapeHtml(item.content)}</p>
            <div>
              ${item.status === '編輯中' ? `
                <button class="btn-warning" data-action="edit">編輯</button>
                <button class="btn-danger" data-action="delete">刪除</button>
                <button class="btn-success" data-action="submit">送出投稿</button>
              ` : '<small style="color:#666;">稿件已進入審查流轉程序，無法修改或刪除。</small>'}
            </div>
          `;
          card.querySelector('[data-action="edit"]')?.addEventListener('click', () => setupEdit(item));
          card.querySelector('[data-action="delete"]')?.addEventListener('click', () => deleteArticle(item.id));
          card.querySelector('[data-action="submit"]')?.addEventListener('click', () => submitArticle(item.id));
        } else {
          const isPending = item.status === '審查中';
          card.innerHTML = `
            <div class="article-heading">
              <h4>${escapeHtml(item.title)}</h4>
              <span class="badge ${isPending ? 'badge-review' : 'badge-pass'}">${escapeHtml(getStatusCategory(item, role))}</span>
            </div>
            <p><strong>作者：</strong>${escapeHtml(item.author_name)}</p>
            <p style="background: #f1f3f5; padding: 10px; border-radius: 4px; white-space: pre-wrap;">${escapeHtml(item.content)}</p>
            <div>
              ${isPending ? `
                <button class="btn-success" data-action="approve">通過</button>
                <button class="btn-danger" data-action="reject">退回稿件</button>
              ` : '<small style="color:#666;">稿件已審查通過。</small>'}
            </div>
          `;
          card.querySelector('[data-action="approve"]')?.addEventListener('click', () => approveArticle(item.id));
          card.querySelector('[data-action="reject"]')?.addEventListener('click', () => rejectArticle(item.id));
        }
        container.appendChild(card);
      });
    }

    async function saveArticle() {
      const id = document.getElementById('editArtId').value;
      const author_name = document.getElementById('authorName').value.trim();
      const category = document.getElementById('category').value.trim();
      const title = document.getElementById('artTitle').value.trim();
      const content = document.getElementById('artContent').value.trim();

      if (!author_name || !category || !title || !content) return alert('請完整填寫所有欄位！');

      if (id) {
        // 編輯草稿
        const res = await fetch(`/api/articles/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category, title, content })
        });
        const data = await res.json();
        alert(res.ok ? data.message : data.detail);
      } else {
        // 新增草稿
        const res = await fetch('/api/articles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author_name, category, title, content })
        });
        const data = await res.json();
        alert(res.ok ? data.message : data.detail);
      }
      resetForm();
      loadAuthorArticles();
    }

    function setupEdit(item) {
      document.getElementById('editArtId').value = item.id;
      document.getElementById('category').value = item.category;
      document.getElementById('artTitle').value = item.title;
      document.getElementById('artContent').value = item.content;
      document.getElementById('btnSave').innerText = '儲存修改';
    }

    function resetForm() {
      document.getElementById('editArtId').value = '';
      document.getElementById('category').value = '';
      document.getElementById('artTitle').value = '';
      document.getElementById('artContent').value = '';
      document.getElementById('btnSave').innerText = '儲存草稿 (新增/編輯)';
    }

    async function deleteArticle(id) {
      if (!confirm('確定要刪除這篇草稿嗎？')) return;
      const res = await fetch(`/api/articles/${id}`, { method: 'DELETE' });
      const data = await res.json();
      alert(data.message || data.detail);
      loadAuthorArticles();
    }

    async function submitArticle(id) {
      if (!confirm('送出投稿後將進入審查階段，確定送出嗎？')) return;
      const res = await fetch(`/api/articles/${id}/submit`, { method: 'POST' });
      const data = await res.json();
      alert(data.message || data.detail);
      loadAuthorArticles();
    }

    // ---------- 編輯功能 ----------
    async function loadPendingArticles() {
      const [pendingRes, approvedRes] = await Promise.all([
        fetch('/api/articles/editor/pending'),
        fetch('/api/articles/editor/approved')
      ]);
      const [pendingList, approvedList] = await Promise.all([pendingRes.json(), approvedRes.json()]);
      const container = document.getElementById('editorPendingList');
      renderCategoryList(container, [...pendingList, ...approvedList], 'editor');
    }

    async function approveArticle(id) {
      const res = await fetch(`/api/articles/${id}/approve`, { method: 'POST' });
      const data = await res.json();
      alert(data.message);
      loadPendingArticles();
    }

    async function rejectArticle(id) {
      const res = await fetch(`/api/articles/${id}/reject`, { method: 'POST' });
      const data = await res.json();
      alert(data.message);
      loadPendingArticles();
    }

    loadAuthorArticles();
  </script>
</body>
</html>
